<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File d'Attente - Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .queue-section {
            margin-bottom: 30px;
        }
        .queue-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
        }
        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .queue-title {
            margin: 0;
        }
        .queue-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            color: white;
        }
        .status-PENDING { background: #6c757d; }
        .status-IN_PROGRESS { background: #ffc107; color: black; }
        .status-DONE { background: #28a745; }
        .status-ERROR { background: #dc3545; }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #28a745;
            width: 0%;
            transition: width 0.3s ease;
        }
        .queue-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 0.9em;
        }
        .queue-detail-item {
            padding: 5px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .refresh-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #138496;
        }
        .empty-queue {
            text-align: center;
            color: #6c757d;
            padding: 40px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .summary-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
        }
        .summary-label {
            color: #666;
            margin-top: 5px;
        }
        .task-type {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>File d'Attente des Travaux</h1>

    <nav>
        <a href="/">Dashboard</a> |
        <a href="/products">Produits</a> |
        <a href="/tasks">Tâches</a> |
        <a href="/stats">Statistiques</a>
    </nav>

    <button class="refresh-btn" onclick="loadQueue()">Actualiser</button>

    <!-- Résumé -->
    <div class="summary-cards" id="summary-cards">
        <div class="summary-card">
            <div class="summary-number" id="total-tasks">-</div>
            <div class="summary-label">Tâches totales</div>
        </div>
        <div class="summary-card">
            <div class="summary-number" id="pending-tasks">-</div>
            <div class="summary-label">En attente</div>
        </div>
        <div class="summary-card">
            <div class="summary-number" id="progress-tasks">-</div>
            <div class="summary-label">En cours</div>
        </div>
        <div class="summary-card">
            <div class="summary-number" id="completed-tasks">-</div>
            <div class="summary-label">Terminées</div>
        </div>
    </div>

    <!-- Tâches en cours -->
    <section class="queue-section">
        <h2>Travaux en cours</h2>
        <div id="active-queue">
            <p>Chargement...</p>
        </div>
    </section>

    <!-- File d'attente -->
    <section class="queue-section">
        <h2>File d'attente</h2>
        <div id="pending-queue">
            <p>Chargement...</p>
        </div>
    </section>

    <!-- Tâches terminées récemment -->
    <section class="queue-section">
        <h2>Terminées récemment</h2>
        <div id="completed-queue">
            <p>Chargement...</p>
        </div>
    </section>

    <script src="/static/script.js"></script>
    <script>
        let queueData = [];

        // Charger la file d'attente
        async function loadQueue() {
            try {
                const response = await fetch('/api/queue');
                queueData = await response.json();
                updateSummary();
                displayQueues();
            } catch (error) {
                console.error('Erreur chargement file d\'attente:', error);
                document.getElementById('active-queue').innerHTML = '<p>Erreur de chargement</p>';
                document.getElementById('pending-queue').innerHTML = '<p>Erreur de chargement</p>';
                document.getElementById('completed-queue').innerHTML = '<p>Erreur de chargement</p>';
            }
        }

        // Mettre à jour le résumé
        function updateSummary() {
            const total = queueData.length;
            const pending = queueData.filter(item => item.statut === 'PENDING').length;
            const inProgress = queueData.filter(item => item.statut === 'IN_PROGRESS').length;
            const done = queueData.filter(item => item.statut === 'DONE').length;
            const error = queueData.filter(item => item.statut === 'ERROR').length;

            document.getElementById('total-tasks').textContent = total;
            document.getElementById('pending-tasks').textContent = pending;
            document.getElementById('progress-tasks').textContent = inProgress;
            document.getElementById('completed-tasks').textContent = done;
        }

        // Afficher les files d'attente
        function displayQueues() {
            // Tâches en cours
            const activeTasks = queueData.filter(item => item.statut === 'IN_PROGRESS');
            const pendingTasks = queueData.filter(item => item.statut === 'PENDING');
            const completedTasks = queueData.filter(item => item.statut === 'DONE').slice(0, 10); // 10 dernières terminées

            displayQueueSection('active-queue', activeTasks, 'Aucun travail en cours actuellement.');
            displayQueueSection('pending-queue', pendingTasks, 'Aucune tâche en attente.');
            displayQueueSection('completed-queue', completedTasks, 'Aucune tâche terminée récemment.');
        }

        // Afficher une section de file d'attente
        function displayQueueSection(containerId, tasks, emptyMessage) {
            const container = document.getElementById(containerId);

            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-queue">${emptyMessage}</div>`;
                return;
            }

            // Trier par commande puis par ordre
            tasks.sort((a, b) => {
                if (a.commande_id !== b.commande_id) {
                    return a.commande_id - b.commande_id;
                }
                return a.ordre - b.ordre;
            });

            container.innerHTML = tasks.map(task => `
                <div class="queue-item">
                    <div class="queue-header">
                        <h3 class="queue-title">
                            Commande #${task.commande_id} - Tâche ${task.ordre}
                            <span class="task-type">${task.type_tache}</span>
                        </h3>
                        <span class="queue-status status-${task.statut}">${getStatusName(task.statut)}</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress_percentage}%"></div>
                    </div>

                    <div class="queue-details">
                        <div class="queue-detail-item">
                            <strong>Client:</strong> ${task.nom_client}
                        </div>
                        <div class="queue-detail-item">
                            <strong>Référence:</strong> ${task.reference_externe || 'N/A'}
                        </div>
                        <div class="queue-detail-item">
                            <strong>Quantité:</strong> ${task.quantite_faite}/${task.quantite_totale}
                        </div>
                        <div class="queue-detail-item">
                            <strong>Progression:</strong> ${task.progress_percentage.toFixed(1)}%
                        </div>
                        <div class="queue-detail-item">
                            <strong>Date:</strong> ${new Date(task.date_creation).toLocaleString()}
                        </div>
                    </div>

                    ${task.config.image_path ? `
                        <div style="margin-top: 10px;">
                            <strong>Image:</strong> ${task.config.image_path.split('/').pop()}
                        </div>
                    ` : ''}

                    ${task.statut_commande ? `
                        <div style="margin-top: 10px;">
                            <em>Statut commande: ${getStatusName(task.statut_commande)}</em>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function getStatusName(status) {
            const names = {
                'PENDING': 'En attente',
                'IN_PROGRESS': 'En cours',
                'DONE': 'Terminé',
                'ERROR': 'Erreur',
                'PROCESSING': 'Traitement'
            };
            return names[status] || status;
        }

        // Actualisation automatique toutes les 30 secondes
        let autoRefreshInterval = setInterval(loadQueue, 30000);

        // Chargement initial
        document.addEventListener('DOMContentLoaded', loadQueue);

        // Nettoyer l'intervalle si la page est quittée
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
