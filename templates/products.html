<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Produits - Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .product-form {
            background: #f9f9f9;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        .product-image {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>Gestion des Produits</h1>

    <nav>
        <a href="/">Dashboard</a> |
        <a href="/tasks">Tâches</a> |
        <a href="/queue">File d'attente</a> |
        <a href="/stats">Statistiques</a>
    </nav>

    <!-- Formulaire d'ajout de produit -->
    <div class="product-form">
        <h2>Ajouter un nouveau produit</h2>
        <form id="product-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="nom">Nom du produit *</label>
                <input type="text" id="nom" name="nom" required>
            </div>
            <div class="form-group">
                <label for="sku">SKU (optionnel)</label>
                <input type="text" id="sku" name="sku">
            </div>
            <div class="form-group">
                <label for="rotation">Rotation (degrés)</label>
                <input type="number" id="rotation" name="rotation" value="0" min="0" max="360">
            </div>
            <div class="form-group">
                <label for="image">Image du produit</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary">Ajouter Produit</button>
        </form>
    </div>

    <!-- Liste des produits -->
    <section>
        <h2>Produits existants</h2>
        <div id="products-list" class="product-grid">
            <p>Chargement des produits...</p>
        </div>
    </section>

    <!-- Modal de modification (caché par défaut) -->
    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; max-width: 500px; width: 90%;">
            <h3>Modifier le produit</h3>
            <form id="edit-product-form" enctype="multipart/form-data">
                <input type="hidden" id="edit-product-id" name="product_id">
                <div class="form-group">
                    <label for="edit-nom">Nom du produit *</label>
                    <input type="text" id="edit-nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="edit-sku">SKU (optionnel)</label>
                    <input type="text" id="edit-sku" name="sku">
                </div>
                <div class="form-group">
                    <label for="edit-rotation">Rotation (degrés)</label>
                    <input type="number" id="edit-rotation" name="rotation" value="0" min="0" max="360">
                </div>
                <div class="form-group">
                    <label for="edit-image">Nouvelle image (optionnel)</label>
                    <input type="file" id="edit-image" name="image" accept="image/*">
                </div>
                <button type="submit" class="btn btn-success">Mettre à jour</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Annuler</button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script>
        let products = [];

        // Charger les produits
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                displayProducts();
            } catch (error) {
                console.error('Erreur chargement produits:', error);
                document.getElementById('products-list').innerHTML = '<p>Erreur de chargement des produits</p>';
            }
        }

        // Afficher les produits
        function displayProducts() {
            const container = document.getElementById('products-list');
            if (products.length === 0) {
                container.innerHTML = '<p>Aucun produit trouvé.</p>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <h3>${product.nom}</h3>
                    ${product.image_path ? `<img src="/uploads/products/${product.image_path.split('/').pop()}" alt="${product.nom}" class="product-image" onerror="this.style.display='none'">` : ''}
                    <p><strong>SKU:</strong> ${product.sku || 'N/A'}</p>
                    <p><strong>Rotation:</strong> ${product.rotation}°</p>
                    <button class="btn btn-warning" onclick="editProduct(${product.id})">Modifier</button>
                    <button class="btn btn-danger" onclick="deleteProduct(${product.id})">Supprimer</button>
                </div>
            `).join('');
        }

        // Ajouter un produit
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/products', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Produit ajouté avec succès!');
                    e.target.reset();
                    loadProducts();
                } else {
                    alert('Erreur: ' + result.message);
                }
            } catch (error) {
                console.error('Erreur ajout produit:', error);
                alert('Erreur lors de l\'ajout du produit');
            }
        });

        // Modifier un produit
        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('edit-product-id').value = product.id;
            document.getElementById('edit-nom').value = product.nom;
            document.getElementById('edit-sku').value = product.sku || '';
            document.getElementById('edit-rotation').value = product.rotation;

            document.getElementById('edit-modal').style.display = 'block';
        }

        // Fermer le modal de modification
        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        // Soumettre la modification
        document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const productId = formData.get('product_id');

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'PUT',
                    body: formData
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Produit modifié avec succès!');
                    closeEditModal();
                    loadProducts();
                } else {
                    alert('Erreur: ' + result.message);
                }
            } catch (error) {
                console.error('Erreur modification produit:', error);
                alert('Erreur lors de la modification du produit');
            }
        });

        // Supprimer un produit
        async function deleteProduct(productId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce produit ?')) return;

            try {
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Produit supprimé avec succès!');
                    loadProducts();
                } else {
                    alert('Erreur: ' + result.message);
                }
            } catch (error) {
                console.error('Erreur suppression produit:', error);
                alert('Erreur lors de la suppression du produit');
            }
        }

        // Chargement initial
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
