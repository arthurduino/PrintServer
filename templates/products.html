<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des produits - Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <h1 class="nav-title">🖨️ Serveur d'Impression</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">Accueil</a>
                <a href="/new-task" class="nav-link">Nouvelle tâche</a>
                <a href="/commandes" class="nav-link">Commandes</a>
                <a href="/products" class="nav-link active">Produits</a>
                <a href="/archive" class="nav-link">Archive</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Create Product -->
        <div class="section create-section">
            <h2>Créer un nouveau produit</h2>

            <form id="product-form" class="simple-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom du produit:</label>
                        <input type="text" id="nom" name="nom" required placeholder="Ex: Logo Entreprise">
                    </div>
                    <div class="form-group">
                        <label for="description">Description (optionnel):</label>
                        <input type="text" id="description" name="description" placeholder="Description du produit">
                    </div>
                    <div class="form-group">
                        <label for="product-files">Image:</label>
                        <input type="file" id="product-files" name="files" accept="image/*" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="product-label_type">Format:</label>
                        <select id="product-label_type" name="label_type" required>
                            <option value="62">62mm</option>
                            <option value="48">48mm</option>
                            <option value="30">30mm</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary full-width">
                            Créer le produit
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Products List -->
        <div class="section">
            <h2>Produits enregistrés</h2>
            <div id="products-list" class="products-grid">
                <!-- Les produits seront chargés ici -->
            </div>
        </div>
    </div>

    <!-- Message overlay -->
    <div id="message-overlay" class="message-overlay" style="display: none;">
        <div class="message-content">
            <h3 id="message-title">Succès</h3>
            <p id="message-text">Produit créé</p>
            <button id="message-close" class="btn btn-primary">OK</button>
        </div>
    </div>

    <script src="/static/products.js"></script>
</body>
</html>
