<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <h1 class="nav-title">🖨️ Serveur d'Impression</h1>
            <div class="nav-links">
                <a href="/" class="nav-link active">Accueil</a>
                <a href="/new-task" class="nav-link">Nouvelle tâche</a>
                <a href="/commandes" class="nav-link">Commandes</a>
                <a href="/products" class="nav-link">Produits</a>
                <a href="/archive" class="nav-link">Archive</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Status -->
        <div class="section status-section">
            <div class="status-display">
                <div class="status-left">
                    <h2>État du système</h2>
                    <div id="printer-status">Chargement...</div>
                </div>
                <div class="status-right">
                    <button id="test-api-btn" class="btn btn-primary" style="margin-right: 10px;">Test API</button>
                    <button id="pause-btn" class="btn btn-secondary">Pause</button>
                    <button id="resume-btn" class="btn btn-primary">Resume</button>
                </div>
            </div>
        </div>

        <!-- Current Job -->
        <div class="section job-section">
            <h2>Tâche en cours</h2>
            <div id="current-job" class="job-display">
                <p>Aucune tâche en cours</p>
            </div>
        </div>

        <!-- Job Queue -->
        <div class="section queue-section">
            <h2>File d'attente</h2>
            <div id="job-list" class="queue-list">
                <p>File vide</p>
            </div>
        </div>

        <!-- Debug Section -->
        <div class="section debug-section">
            <h2>Debug Informations</h2>
            <div id="debug-info" style="font-family: monospace; font-size: 0.8em; background: #f8f9fa; padding: 10px; border-radius: 5px; border: 1px solid #dee2e6;">
                <div><strong>🔍 Chargement des infos de debug...</strong></div>
                <div id="debug-jobs-count">Jobs en base: -</div>
                <div id="debug-worker-status">Worker: -</div>
                <div id="debug-last-update">Dernière mise à jour: -</div>
            </div>
        </div>
    </div>

    <!-- Message overlay -->
    <div id="message-overlay" class="message-overlay" style="display: none;">
        <div class="message-content">
            <h3 id="message-title">Succès</h3>
            <p id="message-text">Tâche créée</p>
            <button id="message-close" class="btn btn-primary">OK</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
