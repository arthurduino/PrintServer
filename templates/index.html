<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Status -->
        <div class="section status-section">
            <div class="status-display">
                <div class="status-left">
                    <h1>🖨️ Serveur d'Impression</h1>
                    <div id="printer-status">Chargement...</div>
                </div>
                <div class="status-right">
                    <button id="pause-btn" class="btn btn-secondary">Pause</button>
                    <button id="resume-btn" class="btn btn-primary">Resume</button>
                </div>
            </div>
        </div>

        <!-- Current Job -->
        <div class="section job-section">
            <h2>Tâche en cours</h2>
            <div id="current-job" class="job-display">
                <p>Aucune tâche en cours</p>
            </div>
        </div>

        <!-- Job Queue -->
        <div class="section queue-section">
            <h2>File d'attente</h2>
            <div id="job-list" class="queue-list">
                <p>File vide</p>
            </div>
        </div>

        <!-- Create Job -->
        <div class="section create-section">
            <h2>Créer une tâche</h2>
            <form id="job-form" class="simple-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="files">Image:</label>
                        <input type="file" id="files" name="files" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantité:</label>
                        <input type="number" id="quantity" name="quantity" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="label_type">Format:</label>
                        <select id="label_type" name="label_type" required>
                            <option value="62">62mm</option>
                            <option value="48">48mm</option>
                            <option value="30">30mm</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="rotate">Rotation:</label>
                        <select id="rotate" name="rotate" required>
                            <option value="0">0°</option>
                            <option value="90">90°</option>
                            <option value="180">180°</option>
                            <option value="270">270°</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cut">
                            <input type="checkbox" id="cut" name="cut" checked> Découpe
                        </label>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary full-width">
                            Créer la tâche
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Message overlay -->
    <div id="message-overlay" class="message-overlay" style="display: none;">
        <div class="message-content">
            <h3 id="message-title">Succès</h3>
            <p id="message-text">Tâche créée</p>
            <button id="message-close" class="btn btn-primary">OK</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
